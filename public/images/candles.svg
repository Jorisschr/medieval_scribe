<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
    <style>
        .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.1s ease-in-out infinite alternate; }
        .flame--short { animation-duration: 1.7s; animation-delay: -0.6s; }
        .glow { animation: glow 2.1s ease-in-out infinite alternate; }
        .glow--short { animation-duration: 1.7s; animation-delay: -0.6s; }
        @keyframes flicker {
            0% { transform: scale(1, 1) skewX(0deg); }
            20% { transform: scale(0.95, 1.06) skewX(2deg); }
            45% { transform: scale(1.03, 0.95) skewX(-1.5deg); }
            70% { transform: scale(0.97, 1.04) skewX(1deg); }
            100% { transform: scale(1.01, 0.98) skewX(-0.5deg); }
        }
        @keyframes glow {
            0% { opacity: 0.85; }
            30% { opacity: 0.65; }
            60% { opacity: 0.95; }
            100% { opacity: 0.75; }
        }
        @media (prefers-reduced-motion: reduce) {
            .flame, .glow { animation: none; }
        }
    </style>
    <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
            <stop offset="0.45" stop-color="#ff9a3c" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#fff6d8"/>
            <stop offset="0.35" stop-color="#ffd36b"/>
            <stop offset="0.75" stop-color="#ff9b2e"/>
            <stop offset="1" stop-color="#e8551a" stop-opacity="0.85"/>
        </linearGradient>
        <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#b7a07a"/>
            <stop offset="0.35" stop-color="#efe2c2"/>
            <stop offset="0.6" stop-color="#e2d2ab"/>
            <stop offset="1" stop-color="#9c8660"/>
        </linearGradient>
        <linearGradient id="waxTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1c9"/>
            <stop offset="1" stop-color="#e3cf9f"/>
        </linearGradient>
        <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6a5a4a"/>
            <stop offset="0.5" stop-color="#3a2f26"/>
            <stop offset="1" stop-color="#1c1510"/>
        </linearGradient>
        <!-- Warm light falling on the wax from the flame above -->
        <radialGradient id="lit" cx="50%" cy="0%" r="80%">
            <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Glows -->
    <circle class="glow" cx="42" cy="34" r="40" fill="url(#halo)"/>
    <circle class="glow glow--short" cx="84" cy="74" r="32" fill="url(#halo)"/>

    <!-- Tall candle -->
    <rect x="31" y="52" width="22" height="104" rx="2.5" fill="url(#wax)"/>
    <rect x="31" y="52" width="22" height="40" rx="2.5" fill="url(#lit)"/>
    <ellipse cx="42" cy="52.5" rx="11" ry="3" fill="url(#waxTop)"/>
    <path d="M31 53c0 5 1 9 2.6 10.5 1.6 1.5 2.4-1 2.4-4.5V54zM47 54c.5 8 1.2 15 3 16.2 1.8 1.2 2.6-2.2 2.6-6.5V53.5z" fill="#efe2c2" opacity="0.9"/>
    <line x1="42" y1="52" x2="42" y2="45" stroke="#2a1a10" stroke-width="1.6" stroke-linecap="round"/>
    <path class="flame" d="M42 14c5 9 8.5 16 7.5 23-.8 5.5-4 9-7.5 9s-6.7-3.5-7.5-9c-1-7 2.5-14 7.5-23z" fill="url(#fire)"/>
    <ellipse cx="42" cy="41" rx="2.6" ry="4" fill="#9fc6ff" opacity="0.55"/>

    <!-- Short candle -->
    <rect x="74" y="92" width="20" height="64" rx="2.5" fill="url(#wax)"/>
    <rect x="74" y="92" width="20" height="30" rx="2.5" fill="url(#lit)"/>
    <ellipse cx="84" cy="92.5" rx="10" ry="2.8" fill="url(#waxTop)"/>
    <path d="M89 93c.4 6 1 11 2.5 12 1.5 1 2.3-1.8 2.3-5.2V93z" fill="#efe2c2" opacity="0.9"/>
    <line x1="84" y1="92" x2="84" y2="86" stroke="#2a1a10" stroke-width="1.5" stroke-linecap="round"/>
    <path class="flame flame--short" d="M84 60c4.4 8 7.5 14 6.6 20-.7 4.8-3.5 7.8-6.6 7.8s-5.9-3-6.6-7.8c-.9-6 2.2-12 6.6-20z" fill="url(#fire)"/>
    <ellipse cx="84" cy="83" rx="2.3" ry="3.5" fill="#9fc6ff" opacity="0.55"/>

    <!-- Iron holder -->
    <ellipse cx="62" cy="165" rx="52" ry="10" fill="#000" opacity="0.35"/>
    <path d="M14 156h96l-6 8H20z" fill="url(#iron)"/>
    <ellipse cx="62" cy="156" rx="48" ry="5" fill="#4a3d31"/>
    <ellipse cx="62" cy="155.5" rx="44" ry="3.4" fill="#2b221b"/>
    <path d="M110 158c6 0 9 3 9 6s-3 5-7 5" fill="none" stroke="#3a2f26" stroke-width="3" stroke-linecap="round"/>
</svg>
